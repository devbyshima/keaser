name: Keaser
options:
  bundleIdPrefix: com.fulltimestudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  KeaserKit:
    path: Packages/KeaserKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7WHQR6L96K
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

schemes:
  Keaser:
    build:
      targets:
        Keaser: all
        KeaserWidgets: all
    run:
      config: Debug
      storeKitConfiguration: Keaser/Resources/Keaser.storekit
    archive:
      config: Release
  # App Intents tests (AppIntentsTesting, iOS 27 simulator):
  # ./scripts/intents-test.sh
  KeaserIntentTests:
    build:
      targets:
        Keaser: all
        KeaserIntentTests: [test]
    test:
      config: Debug
      targets:
        - KeaserIntentTests

targets:
  Keaser:
    type: application
    platform: iOS
    sources:
      - path: Keaser
        excludes:
          - Resources/Keaser.storekit
      # Only the scheme uses it (local StoreKit testing); never ship it.
      - path: Keaser/Resources/Keaser.storekit
        buildPhase: none
      # Widget views and the account entity, shared so onboarding draws the
      # real widget and the Add Expense shortcut can pick an account.
      - KeaserWidgets/Shared
    dependencies:
      - package: KeaserKit
      # Apple Intelligence (Foundation Models, on device); the app only.
      - package: KeaserKit
        product: KeaserIntelligence
      - target: KeaserWidgets
    entitlements:
      path: Keaser/App/Keaser.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fulltimestudio.keaser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.keaser
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        # Keaser/Resources/AppIcon.icon, an Icon Composer document written by
        # scripts/make_icon.swift. Xcode renders the flat iOS 18 to 25 icons
        # from it at build time.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Keaser/App/Info.plist
      properties:
        CFBundleDisplayName: Keaser
        # Other ways Siri hears "Keaser", so "How much did I spend this week
        # in Keaser" reaches the app's shortcuts instead of Siri's own search.
        INAlternativeAppNames:
          - INAlternativeAppName: Kaiser
          - INAlternativeAppName: Keza
          - INAlternativeAppName: Keeser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Resembles the first screen: black in dark mode, pale grey in light.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: false
        # Only receipts (scanning one into New Expense, or attaching a
        # photo of one to an expense) ask for the camera.
        NSCameraUsageDescription: Keaser uses the camera to photograph receipts. The photo is read on your iPhone and, if you attach it, kept with the expense on this iPhone. Nothing is uploaded.
        CFBundleURLTypes:
          - CFBundleURLName: com.fulltimestudio.keaser
            CFBundleURLSchemes: [keaser]

  KeaserWidgets:
    type: app-extension
    platform: iOS
    sources:
      - KeaserWidgets
    dependencies:
      - package: KeaserKit
    entitlements:
      path: KeaserWidgets/KeaserWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fulltimestudio.keaser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.keaser.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    info:
      path: KeaserWidgets/Info.plist
      properties:
        CFBundleDisplayName: Keaser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Runs every App Intent and entity query through the system, as Siri and
  # Shortcuts do, with AppIntentsTesting (iOS 27 only). It never imports the
  # app's code. See scripts/intents-test.sh.
  KeaserIntentTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - KeaserIntentTests
    dependencies:
      - target: Keaser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.keaser.intent-tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
