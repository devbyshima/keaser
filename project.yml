name: Keaser
options:
  bundleIdPrefix: com.fulltimestudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  KeaserKit:
    path: Packages/KeaserKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7WHQR6L96K
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

schemes:
  Keaser:
    build:
      targets:
        Keaser: all
        KeaserWidgets: all
    run:
      config: Debug
      storeKitConfiguration: Keaser/Resources/Keaser.storekit
    archive:
      config: Release

targets:
  Keaser:
    type: application
    platform: iOS
    sources:
      - path: Keaser
        excludes:
          - Resources/Keaser.storekit
      # Only the scheme uses it (local StoreKit testing); never ship it.
      - path: Keaser/Resources/Keaser.storekit
        buildPhase: none
      # Widget views and the account entity, shared so onboarding draws the
      # real widget and the Add Expense shortcut can pick an account.
      - KeaserWidgets/Shared
    dependencies:
      - package: KeaserKit
      # Apple Intelligence (Foundation Models, on device); the app only.
      - package: KeaserKit
        product: KeaserIntelligence
      - target: KeaserWidgets
    entitlements:
      path: Keaser/App/Keaser.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fulltimestudio.keaser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.keaser
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Keaser/App/Info.plist
      properties:
        CFBundleDisplayName: Keaser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Resembles the first screen: black in dark mode, pale grey in light.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: false
        # Only the receipt scanner in New Expense asks for the camera.
        NSCameraUsageDescription: Keaser uses the camera to scan a receipt into a new expense. The photo is read on your iPhone and is not kept.
        CFBundleURLTypes:
          - CFBundleURLName: com.fulltimestudio.keaser
            CFBundleURLSchemes: [keaser]

  KeaserWidgets:
    type: app-extension
    platform: iOS
    sources:
      - KeaserWidgets
    dependencies:
      - package: KeaserKit
    entitlements:
      path: KeaserWidgets/KeaserWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fulltimestudio.keaser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.keaser.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    info:
      path: KeaserWidgets/Info.plist
      properties:
        CFBundleDisplayName: Keaser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
